name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:docs
      - run: npm run build
      # The example drives the simulator through the built package, as a user would
      - run: node examples/simulator.ts
      # Packs only what it should (dist without tests, README, LICENSE, CHANGELOG)
      - run: npm pack --dry-run
